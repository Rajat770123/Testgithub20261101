<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="description" content="A simple, welcoming starting point for your website." />
		<title>Welcome</title>
		<style>
			:root {
				color-scheme: light;
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #172033;
				background: #f5f7fb;
			}

			* { box-sizing: border-box; }
			body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; }
			main { width: min(100%, 42rem); padding: clamp(2rem, 7vw, 4rem); text-align: center; background: #fff; border: 1px solid #e5e9f2; border-radius: 1.25rem; box-shadow: 0 1.5rem 4rem rgb(23 32 51 / 8%); }
			h1 { margin: 0 0 1rem; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -0.04em; }
			p { margin: 0; color: #596579; font-size: 1.125rem; line-height: 1.7; }
		</style>
	</head>
	<body>
		<main>
			<h1>Welcome</h1>
			<p>Your website is ready to get started. Make this space your own.</p>
            
		</main>
	</body>
</html>
