<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f6f7fb">
	<title>Sign in</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172033;
			background: #f6f7fb;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 28px 18px;
			background: radial-gradient(circle at 12% 12%, #e8edff 0, transparent 34%),
									radial-gradient(circle at 88% 90%, #e5f6f1 0, transparent 30%), #f6f7fb;
		}

		.login-card {
			width: min(100%, 430px);
			padding: 42px;
			border: 1px solid #e8eaf0;
			border-radius: 20px;
			background: #fff;
			box-shadow: 0 24px 70px rgb(34 45 80 / 10%);
		}

		.brand-mark {
			display: grid;
			width: 44px;
			height: 44px;
			place-items: center;
			margin-bottom: 28px;
			border-radius: 13px;
			background: #eef0ff;
			color: #5146e5;
			font-size: 22px;
			font-weight: 800;
		}

		h1 { margin: 0; font-size: 28px; letter-spacing: -0.8px; }
		.intro { margin: 9px 0 30px; color: #697386; font-size: 15px; line-height: 1.5; }

		.field { margin-bottom: 19px; }
		label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 650; }
		input {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			border: 1px solid #dfe3eb;
			border-radius: 9px;
			outline: none;
			background: #fff;
			color: #172033;
			font: inherit;
			font-size: 14px;
			transition: border-color .2s, box-shadow .2s;
		}
		input::placeholder { color: #9aa2b1; }
		input:focus { border-color: #675cf0; box-shadow: 0 0 0 3px rgb(103 92 240 / 14%); }

		.form-options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 2px 0 24px;
			font-size: 13px;
		}
		.remember { display: inline-flex; align-items: center; gap: 8px; color: #596275; }
		.remember input { width: 15px; height: 15px; margin: 0; accent-color: #5b50e8; }
		a { color: #5146d9; font-weight: 600; text-decoration: none; }
		a:hover { text-decoration: underline; }

		.submit-button {
			width: 100%;
			height: 49px;
			border: 0;
			border-radius: 9px;
			background: #5549e8;
			color: #fff;
			font: inherit;
			font-size: 15px;
			font-weight: 700;
			cursor: pointer;
			transition: background .2s, transform .2s;
		}
		.submit-button:hover { background: #4539d3; }
		.submit-button:active { transform: translateY(1px); }

		.signup { margin: 25px 0 0; color: #778092; text-align: center; font-size: 13px; }

		@media (max-width: 480px) {
			.login-card { padding: 32px 24px; }
		}
	</style>
</head>
<body>
	<main class="login-card">
		<div class="brand-mark" aria-hidden="true">A</div>
		<h1>Welcome back</h1>
		<p class="intro">Sign in to your account to continue.</p>

		<form action="#" method="post">
			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
			</div>

			<div class="form-options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>

			<button class="submit-button" type="submit">Sign in</button>
		</form>

		<p class="signup">Don't have an account? <a href="#sign-up">Create one</a></p>
	</main>
</body>
</html>
